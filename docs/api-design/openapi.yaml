      type: object
      required:
        - rawCredentials
      properties:
        rawCredentials:
          type: object
          required:
            - accessToken
          properties:
            accessToken:
              type: string
              example: ghp_abcdef1234567890
            refreshToken:
              type: string
              example: r_abcdef1234567890

    ResolveConflictRequest:
      type: object
      required:
        - strategy
      properties:
