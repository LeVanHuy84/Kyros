          example: conn-9876
        workspaceId:
          type: string
          format: uuid
          example: ws-1234
        providerType:
          $ref: '#/components/schemas/ConnectorProviderType'
        status:
          $ref: '#/components/schemas/ConnectorConnectionStatus'
        syncMode:
          $ref: '#/components/schemas/ConnectorSyncMode'
        filterRules:
          type: object
          properties:
            tags:
              type: array
              items:
                type: string
              example: ["synced"]
            project:
              type: string
              example: Assistant

