        status:
          $ref: '#/components/schemas/ConnectorConnectionStatus'
        lastSuccessfulSync:
          type: string
          format: date-time
          example: "2026-08-02T10:00:00Z"
        lastError:
          type: string
          example: "Rate limit exceeded"
        isInBackoff:
          type: boolean
          example: true
        retryAfter:
          type: string
          format: date-time
          example: "2026-08-02T10:05:00Z"

    SyncConflictDTO:
      type: object
      required:
        - conflictId
