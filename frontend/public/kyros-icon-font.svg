<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <!-- White squircle background -->
  <rect width="512" height="512" rx="128" fill="#FFFFFF" />
  
  <g transform="translate(0, 0)">
    <!-- Vertical stem -->
    <rect x="151" y="100" width="48" height="312" rx="24" fill="url(#grad-primary)" />
    
    <!-- Top-Right Ribbon (accent gradient) -->
    <path d="M 175 256 C 211 256 331 180 361 130 C 381 100 351 70 321 90 C 261 130 201 210 175 256 Z" fill="url(#grad-accent)" opacity="0.95" />
    
    <!-- Bottom-Right Ribbon (primary gradient) -->
    <path d="M 175 256 C 211 256 331 332 361 382 C 381 412 351 442 321 422 C 261 382 201 302 175 256 Z" fill="url(#grad-primary)" />
    
    <!-- Intelligent Center Node -->
    <circle cx="175" cy="256" r="28" fill="#FFFFFF" />
    <circle cx="175" cy="256" r="16" fill="url(#grad-primary)" />
  </g>
</svg>