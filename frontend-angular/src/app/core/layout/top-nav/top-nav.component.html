<header class="top-nav">
  <div class="nav-left">
    <button
      class="menu-toggle-btn"
      (click)="toggleSidebar.emit()"
      [attr.aria-label]="languageService.t().topNav.toggleSidebar"
      [title]="languageService.t().topNav.toggleSidebar"
    >
      <app-icon name="menu" [size]="18"></app-icon>
    </button>

    <!-- Workspace Tenant Selector -->
    <app-tenant-selector></app-tenant-selector>

    <!-- Quick Command Palette / Search Trigger -->
    <button class="search-trigger-btn" (click)="searchClicked.emit()" [title]="languageService.t().topNav.searchPlaceholder">
      <app-icon name="search" [size]="15" class="search-icon"></app-icon>
      <span class="search-placeholder">{{ languageService.t().topNav.searchPlaceholder }}</span>
      <kbd class="search-shortcut">{{ languageService.t().topNav.searchShortcut }}</kbd>
    </button>
  </div>

  <div class="nav-right">
    <!-- Language Switcher -->
    <button
      class="lang-switch-btn"
      (click)="languageService.toggleLanguage()"
      [title]="languageService.t().topNav.switchLangTooltip"
      aria-label="Switch Language"
    >
      <span class="lang-flag">{{ languageService.currentLanguage() === 'vi' ? '🇻🇳' : '🇬🇧' }}</span>
      <span class="lang-code">{{ languageService.currentLanguage().toUpperCase() }}</span>
    </button>

    <!-- Theme Toggle -->
    <button
      class="nav-icon-btn"
      (click)="themeService.toggleTheme()"
      [title]="themeService.isDark() ? languageService.t().topNav.lightModeTooltip : languageService.t().topNav.darkModeTooltip"
      aria-label="Toggle theme"
    >
      @if (themeService.isDark()) {
        <app-icon name="sun" [size]="18"></app-icon>
      } @else {
        <app-icon name="moon" [size]="18"></app-icon>
      }
    </button>

    <!-- Notification Dropdown -->
    <app-notification-dropdown></app-notification-dropdown>

    <div class="divider"></div>

    <!-- User Profile Dropdown -->
    <div class="user-profile-container">
      <button
        type="button"
        class="user-profile-btn"
        (click)="toggleUserMenu()"
        [title]="languageService.t().topNav.userProfile"
        aria-haspopup="menu"
        [attr.aria-expanded]="isUserMenuOpen()"
      >
        <app-avatar
          [name]="authService.currentUser()?.name || authService.currentUser()?.email || 'Executive'"
          [size]="32"
        ></app-avatar>
        <span class="user-name">{{ authService.currentUser()?.name || 'Executive' }}</span>
        <app-icon name="chevron-down" [size]="13" class="user-chevron" [class.open]="isUserMenuOpen()"></app-icon>
      </button>

      @if (isUserMenuOpen()) {
        <div class="user-menu-dropdown animate-fade-in-scale" role="menu">
          <div class="user-menu-header">
            <span class="menu-user-name">{{ authService.currentUser()?.name || 'Executive User' }}</span>
            <span class="menu-user-email">{{ authService.currentUser()?.email }}</span>
          </div>

          <div class="user-menu-items">
            <button type="button" class="user-menu-item logout" (click)="handleLogout()" role="menuitem">
              <app-icon name="log-out" [size]="15"></app-icon>
              <span>{{ languageService.t().user.logout }}</span>
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</header>
