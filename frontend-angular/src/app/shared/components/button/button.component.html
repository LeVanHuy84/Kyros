<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [class]="buttonClasses()"
  (click)="onClick($event)"
>
  @if (loading()) {
    <span class="btn-spinner"></span>
  }
  <ng-content select="[slot=prefix]"></ng-content>
  <span class="btn-text"><ng-content></ng-content></span>
  <ng-content select="[slot=suffix]"></ng-content>
</button>
