<div class="kyros-logo-wrapper" [class.show-text]="showText()">
  <svg
    [style.width.px]="size()"
    [style.height.px]="size()"
    viewBox="0 0 512 512"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    class="logo-svg"
  >
    <defs>
      <linearGradient [id]="gradBgId" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1b4332" />
        <stop offset="50%" stop-color="#2d6a4f" />
        <stop offset="100%" stop-color="#40916c" />
      </linearGradient>

      <linearGradient [id]="gradWarmId" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#d4a373" />
        <stop offset="100%" stop-color="#faedcd" />
      </linearGradient>

      <linearGradient [id]="gradStemId" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="100%" stop-color="#e8f5e9" />
      </linearGradient>
    </defs>

    <!-- Squircle Canvas -->
    <rect x="32" y="32" width="448" height="448" rx="112" [attr.fill]="'url(#' + gradBgId + ')'" />
    <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="3" />

    <g transform="translate(4, 0)">
      <!-- Vertical Stem -->
      <rect x="150" y="120" width="44" height="272" rx="22" [attr.fill]="'url(#' + gradStemId + ')'" />

      <!-- Top Warm Ribbon -->
      <path
        d="M 172 256 C 210 256 315 190 348 152 C 368 128 344 102 318 118 C 265 150 205 218 172 256 Z"
        [attr.fill]="'url(#' + gradWarmId + ')'"
      />

      <!-- Bottom Fresh Ribbon -->
      <path
        d="M 172 256 C 210 256 315 322 348 360 C 368 384 344 410 318 394 C 265 362 205 294 172 256 Z"
        fill="#d8f3dc"
        opacity="0.92"
      />

      <!-- Central Intelligence Node -->
      <circle cx="172" cy="256" r="26" fill="#ffffff" />
      <circle cx="172" cy="256" r="15" fill="#2d6a4f" />
      <circle cx="172" cy="256" r="6" fill="#d4a373" />
    </g>
  </svg>

  @if (showText()) {
    <div class="brand-text">
      <span class="brand-title">Kyros</span>
      <span class="brand-subtitle">Executive Assistant</span>
    </div>
  }
</div>
