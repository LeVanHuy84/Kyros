@if (isOpen()) {
  <div class="confirm-backdrop animate-fade-in" (click)="onBackdropClick()">
    <div class="confirm-card animate-scale-up" (click)="$event.stopPropagation()">
      <div class="confirm-header">
        <div class="header-icon-wrap" [attr.data-variant]="variant()">
          <app-icon [name]="iconName()" [size]="20"></app-icon>
        </div>
        <div class="header-text">
          <h3 class="confirm-title">{{ title() }}</h3>
        </div>
        <button
          type="button"
          class="close-btn"
          (click)="onCancel()"
          [disabled]="loading()"
          aria-label="Close dialog"
        >
          <app-icon name="x" [size]="16"></app-icon>
        </button>
      </div>

      <div class="confirm-body">
        <p class="confirm-message">{{ message() }}</p>
        <ng-content></ng-content>
      </div>

      <div class="confirm-footer">
        <app-button
          variant="outline"
          size="md"
          [disabled]="loading()"
          (buttonClick)="onCancel()"
        >
          {{ cancelText() }}
        </app-button>
        <app-button
          [variant]="variant() === 'danger' ? 'danger' : 'primary'"
          size="md"
          [loading]="loading()"
          [disabled]="loading()"
          (buttonClick)="onConfirm()"
        >
          {{ confirmText() }}
        </app-button>
      </div>
    </div>
  </div>
}
