<aside class="conv-sidebar">
  <!-- New Conversation Button -->
  <div class="sidebar-header">
    <button type="button" class="new-chat-btn" (click)="newConversation.emit()">
      <app-icon name="plus" [size]="14"></app-icon>
      <span>{{ languageService.t().agent.newChat }}</span>
    </button>
  </div>

  <!-- Conversations List -->
  <div class="conv-list" role="listbox" [attr.aria-label]="languageService.t().agent.history">
    @for (conv of conversations(); track conv.id) {
      <div
        class="conv-item"
        [class.active]="conv.id === activeConversationId()"
        (click)="selectConversation.emit(conv.id)"
        role="option"
        [attr.aria-selected]="conv.id === activeConversationId()"
      >
        <app-icon name="sparkles" [size]="12" class="conv-icon"></app-icon>
        <span class="conv-title" [title]="getDisplayTitle(conv.title)">{{ getDisplayTitle(conv.title) }}</span>
        <button
          type="button"
          class="delete-btn"
          (click)="onDelete($event, conv.id)"
          aria-label="Delete"
        >
          <app-icon name="trash" [size]="11"></app-icon>
        </button>
      </div>
    } @empty {
      <div class="empty-conv">
        <app-icon name="sparkles" [size]="18" class="empty-icon"></app-icon>
        <span>{{ languageService.t().agent.noHistory }}</span>
      </div>
    }
  </div>
</aside>
