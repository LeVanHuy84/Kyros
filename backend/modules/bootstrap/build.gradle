plugins {
    alias(libs.plugins.spring.boot)
    id 'java-quality'
}

dependencies {
    implementation platform(libs.spring.boot.bom)

    implementation project(':modules:shared-kernel')
    implementation project(':modules:auth')
    implementation project(':modules:workspace')
    implementation project(':modules:todo')
    implementation project(':modules:calendar')
    implementation project(':modules:memory')
    implementation project(':modules:notification')
    implementation project(':modules:connector')
    implementation project(':modules:agent')

    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.data.jpa
    implementation libs.spring.boot.starter.data.redis
    implementation libs.spring.boot.starter.validation
    implementation libs.flyway.core
    implementation libs.flyway.database.postgresql
    implementation libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson
    runtimeOnly libs.postgresql
    implementation libs.springdoc.openapi.starter.webmvc.api
    implementation libs.scalar.webmvc


    testImplementation libs.spring.boot.starter.test
    testImplementation libs.archunit
}

springBoot {
    mainClass = 'com.assistant.bootstrap.AiExecutiveAssistantApplication'
}

tasks.named('bootRun') {
    jvmArgs = [
        "--enable-native-access=ALL-UNNAMED",
        "--sun-misc-unsafe-memory-access=allow"
    ]

    // Load local environment variables from monorepo root .env file
    def envFile = rootProject.file('../.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            line = line.trim()
            if (!line.isEmpty() && !line.startsWith('#') && line.contains('=')) {
                def parts = line.split('=', 2)
                if (parts.length == 2) {
                    environment parts[0].trim(), parts[1].trim()
                }
            }
        }
    }
}
