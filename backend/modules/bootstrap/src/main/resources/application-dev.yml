spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/assistant_db
    username: assistant_user
    password: assistant_secure_pwd
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar
  pageTitle: "AI Executive Assistant API Reference"

