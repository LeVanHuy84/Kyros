plugins {
    alias(libs.plugins.spring.boot) apply false
    id 'java'
    alias(libs.plugins.spotless) apply false
}

allprojects {
    apply plugin: 'com.diffplug.spotless'

    spotless {
        format('misc') {
            target '*.md', '.gitignore', '*.yml', '*.yaml'
            trimTrailingWhitespace()
            indentWithSpaces(2)
            endWithNewline()
        }
        format('gradle') {
            target '*.gradle'
            trimTrailingWhitespace()
            indentWithSpaces(4)
            endWithNewline()
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'eclipse'

    eclipse {
        jdt {
            file {
                withProperties { properties ->
                    properties['org.eclipse.jdt.core.compiler.annotation.nullanalysis'] = 'disabled'
                    properties['org.eclipse.jdt.core.compiler.problem.potentialNullReference'] = 'ignore'
                    properties['org.eclipse.jdt.core.compiler.problem.nullReference'] = 'ignore'
                    properties['org.eclipse.jdt.core.compiler.problem.nullSpecViolation'] = 'ignore'
                    properties['org.eclipse.jdt.core.compiler.problem.nullAnnotationInferenceConflict'] = 'ignore'
                }
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}
