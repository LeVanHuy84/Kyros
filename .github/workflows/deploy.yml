name: Continuous Deployment (Backend)

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-backend:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: |
          echo "IMAGE_REPOSITORY=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}/backend:latest
            ${{ env.IMAGE_REPOSITORY }}/backend:${{ github.sha }}

  deploy-backend:
    name: Deploy Backend to Home Linux Server
    needs: build-and-push-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: |
          echo "IMAGE_REPOSITORY=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify Tailscale Connectivity
        run: |
          tailscale status
          tailscale ping --c 3 --timeout 10s 100.126.114.96 || true

      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.126.114.96
          username: huyle
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            echo "SSH connection successful"
            hostname
            docker --version
            docker compose version

      - name: Copy compose.prod.yaml to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 100.126.114.96
          username: huyle
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: 'compose.prod.yaml'
          target: '~/apps/ai-executive-assistant'

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.126.114.96
          username: huyle
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            cd ~/apps/ai-executive-assistant

            mv -f compose.prod.yaml compose.yaml

            cat <<EOF > .env
            IMAGE_REPOSITORY=${{ env.IMAGE_REPOSITORY }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            APP_FRONTEND_URL=${{ secrets.APP_FRONTEND_URL }}

            SPRING_MAIL_HOST=${{ secrets.SPRING_MAIL_HOST }}
            SPRING_MAIL_PORT=${{ secrets.SPRING_MAIL_PORT }}
            SPRING_MAIL_USERNAME=${{ secrets.SPRING_MAIL_USERNAME }}
            SPRING_MAIL_PASSWORD=${{ secrets.SPRING_MAIL_PASSWORD }}
            EOF

            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            docker compose pull
            docker compose up -d

            docker image prune -f
