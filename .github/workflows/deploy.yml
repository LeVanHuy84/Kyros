name: Continuous Deployment

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: |
          echo "IMAGE_REPOSITORY=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}/backend:latest
            ${{ env.IMAGE_REPOSITORY }}/backend:${{ github.sha }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}/frontend:latest
            ${{ env.IMAGE_REPOSITORY }}/frontend:${{ github.sha }}

  deploy:
    name: Deploy to VPS via SSH
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: |
          echo "IMAGE_REPOSITORY=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Create Target Directory and Copy compose.prod.yaml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "compose.prod.yaml"
          target: ${{ secrets.VPS_TARGET_DIR }}

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ${{ secrets.VPS_TARGET_DIR }}
            
            # Rename compose.prod.yaml to compose.yaml
            mv -f compose.prod.yaml compose.yaml
            
            # Create .env file for Docker Compose variables
            cat <<EOF > .env
            IMAGE_REPOSITORY=${{ env.IMAGE_REPOSITORY }}
            DB_USERNAME=${{ secrets.DB_USERNAME || 'assistant_user' }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD || 'assistant_secure_pwd' }}
            JWT_SECRET=${{ secrets.JWT_SECRET || 'super_secret_jwt_key_at_least_256_bits_long' }}
            EOF
            
            # Log in to GHCR on VPS to pull the new images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull new images and restart services
            docker compose pull
            docker compose up -d
            
            # Clean up old unused images to save disk space
            docker image prune -f
